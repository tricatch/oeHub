# 예시
virtual:

  # 멀티 도메인 — 여러 도메인을 같은 백엔드로 라우팅
  # 리버스 프록시가 도메인별 인증서를 자동 생성합니다
  # 주요 용도: 도메인 별칭, 브랜드 통합, 단계적 마이그레이션
  - domain: foo.oe
    location:
      - host: http://${LOCAL_SVR}:36912
        path:
          - /**
  - domain: myip.oe
    location:
      - host: http://${LOCAL_SVR}:36912
        path:
          - /**

  # 서브도메인도 지원 — 각 서브도메인마다 인증서가 자동 생성됩니다
  - domain: dev.foo.oe
    location:
      - host: http://${LOCAL_SVR}:36912
        path:
          - /**

  # 부분 로컬 개발 — 로컬에서 전체 스택을 실행하기 어려울 때
  # 개발 중인 서비스만 로컬에서 실행하고, 나머지는 원격 서버로 프록시
  # 백엔드 호스트는 http/https 모두 지원합니다
  - domain: stg.foo.oe
    location:
      - host: http://${LOCAL_SVR}:8080
        path:
          - /api/**
      - host: https://stg.backend.foo.oe
        path:
          - /**

  # 혼합 백엔드 — Vue/Node 개발 서버와 백엔드 API를 같은 도메인에서 서빙
  # 프론트엔드 개발 서버는 자체 경로(HMR, 정적 리소스)를 처리하고, 나머지는 백엔드로
  - domain: mix.foo.oe
    location:
      - host: https://${LOCAL_SVR}:9528
        path:
          - /
          - /front**
          - /sockjs-node/**
      - host: http://${LOCAL_SVR}:8080
        path:
          - /**
