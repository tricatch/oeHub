# Install CA modal (proxy)
proxy.sidebar.header=Virtual Hosts
proxy.sidebar.count={0} virtual host(s)
proxy.panel.header=Routes
proxy.section.ca.title=Root Certificate
proxy.install.ca.desc=Install the oeProxy root certificate to avoid browser security warnings.
proxy.section.oeoid.title=oeOID Chrome Extension
proxy.oeoid.desc=Once installed, the oeOID extension automatically adds an X-OeHub-Oid header to requests sent to your configured domains, letting those services accurately identify which oeHub user made the request. The target domains can be managed in Settings.
proxy.oeoid.warn.dhcp=Without the extension installed, requests are identified by IP address instead — and since IP addresses can change frequently under DHCP, you may end up misidentified as a different user.
proxy.oeoid.install.guide=Installation Guide
proxy.install.step.download=Download the root certificate below.
proxy.install.win.step2=Double-click the <code>oeHub-CA.cer</code> file.
proxy.install.win.step3=Click <strong>Install Certificate…</strong> → select <strong>Local Machine</strong> → Next.
proxy.install.win.step4=Choose <strong>Place all certificates in the following store</strong> → Browse → <strong>Trusted Root Certification Authorities</strong>.
proxy.install.win.step5=Click Finish and confirm the security prompt.
proxy.install.mac.step2=Double-click <code>oeHub-CA.cer</code> to open <strong>Keychain Access</strong>.
proxy.install.mac.step3=Add it to the <strong>System</strong> keychain.
proxy.install.mac.step4=Find the certificate, right-click → <strong>Get Info</strong> → expand <strong>Trust</strong> → set to <strong>Always Trust</strong>.
proxy.install.mac.step5=Close the dialog and enter your password to confirm.

