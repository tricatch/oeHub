settings.identifier.title=oeProxy - Identifier
settings.identifier.label=Identify Client By
settings.identifier.oid=OID
settings.identifier.ip=IP
settings.identifier.help=OID (sent by the oeOID Chrome extension via the X-OeHub-Oid header) is always used to identify the routing owner. When IP is also enabled, requests without an OID header fall back to matching by client IP address. Disable IP when client addresses are shared/NATed and unreliable for identification.
settings.fwdproxy.title=oeProxy - Forward Proxy
settings.fwdproxy.status=Status
settings.fwdproxy.label=Forward Proxy (port 36980, always on)
settings.fwdproxy.help=Always runs a LittleProxy-based forward proxy on the fixed port shown above; this cannot be disabled. Clients authenticate with their oeHub account credentials (Proxy-Authorization); once authenticated, requests for hosts in that user's currently-selected oeHosts profiles are routed to the recorded IP instead of normal DNS.
settings.fwdproxy.whitelist.label=Relay Whitelist
settings.fwdproxy.whitelist.help=One domain per line (e.g. *.example.com). Wildcard prefix matches the domain and its subdomains. When set, the forward proxy relays only to whitelisted domains; other destinations get a 403. Leave empty to allow all destinations (default).
settings.oeoid.title=oeProxy - Chrome oeOID Domains
settings.oeoid.label=Domains
settings.oeoid.help=One domain per line (e.g. *.foo.oe). Wildcard prefix matches subdomains. Used as the default domain list for the oeOID Chrome extension download. The X-OeHub-Oid header is only added to requests sent to these domains.
